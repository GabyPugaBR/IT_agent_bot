services:
  backend:
    build: ./backend
    container_name: constellations-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: constellations-frontend
    env_file:
      - ./frontend/.env
    environment:
      - HOST=0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      - backend
